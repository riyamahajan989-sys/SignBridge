<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Recognition - SignBridge</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <h1>Sign Recognition</h1>
        <p>Recognize a sign using your camera or upload an image</p>
    </header>

    <main>

        <!-- Live Camera -->
        <section class="hero">

            <h2>Live Sign Recognition</h2>

            <p>
                Show a supported sign in front of your camera.
            </p>

            <button onclick="startCamera()">
                Start Camera
            </button>

            <br><br>

            <video
                id="camera"
                width="350"
                autoplay
                playsinline>
            </video>

            <h3>Detected Sign:</h3>

            <p id="result">
                No sign detected yet.
            </p>

        </section>


        <!-- Upload Image -->
        <section class="hero">

            <h2>Upload a Sign Image</h2>

            <input
                type="file"
                id="signImage"
                accept="image/*"
            >

            <br><br>

            <button onclick="recognizeUploadedImage()">
                Recognize Image
            </button>

            <h3>Image Result:</h3>

            <p id="uploadResult">
                Uploaded sign meaning will appear here.
            </p>

        </section>

    </main>

    <script src="../script.js"></script>

</body>

</html>
